server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the page out of search engines while job searching quietly.
    # Remove this line (and build with ALLOW_INDEXING=true) when you want it indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.pdf$ {
        add_header Content-Disposition 'inline; filename="Jared-Allen-Resume.pdf"';
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
