name: Build and publish resume

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/kustomization.yaml"
      - "README.md"
      - "profile-readme/**"
  workflow_dispatch:

permissions:
  contents: write   # commit the new image tag back for ArgoCD
  packages: write   # push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/resume

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate resume.json
        run: npm run validate

      - name: Render HTML
        run: npm run build

      - name: Render PDF
        run: npm run pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jared-Allen-Resume
          path: dist/Jared-Allen-Resume.pdf

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE }}:latest

      - name: Bump image tag for ArgoCD
        run: |
          cd k8s
          sed -i "s/newTag: .*/newTag: ${{ steps.vars.outputs.sha }}/" kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "deploy: resume ${{ steps.vars.outputs.sha }} [skip ci]" || echo "no change"
          git push
